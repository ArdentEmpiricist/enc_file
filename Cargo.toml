[package]
name = "enc_file"
version = "0.6.5"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "Password-based file encryption tool with a versioned header, AEAD, Argon2id KDF, and streaming mode. Library + CLI + GUI."
homepage = "https://crates.io/crates/enc_file"
documentation = "https://docs.rs/enc_file/latest/enc_file/"
repository = "https://github.com/ArdentEmpiricist/enc_file"
keywords = [
    "encryption",
    "command-line",
    "chacha20poly1305",
    "aes-gcm",
    "blake3",
]
categories = [
    "command-line-utilities",
    "cryptography",
    "encoding",
    "filesystem",
]

[lib]
name = "enc_file"
path = "src/lib.rs"

[[bin]]
name = "enc-file"
path = "src/main.rs"

[[bin]]
name = "enc-file-gui"
path = "src/gui_main.rs"
required-features = ["gui"]

[features]
default = []
gui = ["eframe", "egui", "egui_extras", "rfd", "tokio", "env_logger"]

[dependencies]
# Serialization
serde = { version = "1.0.228", features = ["derive"] }
ciborium = "0.2.2"

# Crypto
argon2 = "0.5.3"
chacha20poly1305 = { version = "0.11.0" }
aes-gcm-siv = "0.12.0-rc.3"

# OS randomness
getrandom = "0.4.3"

# Secrets & hygiene
secrecy = "0.10.3"
zeroize = "1.9.0"

# CLI & errors
clap = { version = "4.6.1", features = ["derive"] }
thiserror = "2.0.18"
anyhow = "1.0.103"

# I/O ergonomics
rpassword = "7.5.4"
tempfile = "3.27.0"

# Hashing (utility subcommand)
blake3 = "1.8.5"
sha2 = "0.11.0"
sha3 = "0.12.0"
blake2 = "0.10.6"
xxhash-rust = { version = "0.8.16", features = ["xxh3"] }
crc = "3.4.0"

# Armor (Base64)
base64 = "0.22.1"

# Hex CLI input
hex = "0.4.3"

# CPU detection for KDF parallelism defaults
num_cpus = "1.17.0"

# GUI dependencies (optional)
eframe = { version = "0.35.0", optional = true }
egui = { version = "0.35.0", optional = true }
egui_extras = { version = "0.35.0", features = ["file"], optional = true }
rfd = { version = "0.17.2", optional = true }
tokio = { version = "1.52.3", features = [
    "rt",
    "rt-multi-thread",
    "fs",
    "sync",
], optional = true }
env_logger = { version = "0.11.11", optional = true }

[dev-dependencies]
proptest = "1.11.0"
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
tempfile = "3.27.0"
rand = { version = "0.10.2", features = ["std"] }
predicates = "3.1.4"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
